---
openapi: 3.0.1
info:
  title: Environmental Sensing API
  version: v1
  description: |
    API to store and read environmental sensor readings and camera pictures.

    **Authentication.** Every endpoint except `GET /api/v1/time` requires an `Authorization: Bearer <token>` header:
    a device token (`esd_...`) for devices, or an API key (`esk_...`) with scope `read` or `admin`.
    Responses: 401 without a valid token, 403 when the token is not allowed for the endpoint,
    429 when rate limited (see the `Retry-After` header).

    **Errors** always have the shape `{"error": {"code", "message", "details"}}`.

    **Pagination.** Readings and pictures are returned newest first. Pass the `next_cursor` of a page
    as `cursor` to get the next one; it is `null` on the last page.
  contact:
    name: API support
    email: mdsoftengr@gmail.com
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
security:
- apiKey: []
tags:
- name: Devices
- name: Sensors
- name: Sensor types
- name: Readings
- name: Pictures
- name: Time
paths:
  "/api/v1/devices":
    get:
      summary: List devices with their sensors
      tags:
      - Devices
      description: API key with scope read or admin.
      responses:
        '200':
          description: devices
          content:
            application/json:
              example:
                devices:
                - uuid: 123-123-000-000
                  name: MKR1010 BME280
                  description: Living room
                  created_at: '2026-09-30T18:00:57.442Z'
                  sensors:
                  - uuid: 123-123-000-001
                    name: Temperature Sensor
                    description:
                    device_uuid: 123-123-000-000
                    sensor_type:
                      id: 568
                      name: Temperature
                      unit: C
                      pow10multi: -2
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      "$ref": "#/components/schemas/device"
                required:
                - devices
                additionalProperties: false
        '401':
          description: missing or invalid token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: A valid bearer token is required
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: token not allowed (e.g. a device token)
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: This token is not allowed to use this endpoint
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Create a device
      tags:
      - Devices
      description: 'API key with scope admin. The response contains the device token
        (api_token), shown only once: store it in the device firmware.'
      parameters: []
      responses:
        '201':
          description: device created
          content:
            application/json:
              example:
                uuid: 123-123-000-010
                name: ESP32 CAM
                description: Garden camera
                created_at: '2026-09-30T18:00:57.859Z'
                sensors: []
                api_token: esd_DAfDLXOcGKxLYC9pRvwP8JtxL_jNDjNpphw8HZiCaLo
              schema:
                "$ref": "#/components/schemas/device_with_token"
        '422':
          description: invalid device (e.g. duplicate uuid)
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  message: Validation failed
                  details:
                    uuid:
                    - has already been taken
                    name:
                    - can't be blank
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: API key without admin scope
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: This token is not allowed to use this endpoint
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid:
                  type: string
                  example: 123-123-000-010
                name:
                  type: string
                  example: ESP32 CAM
                description:
                  type: string
                  example: Garden camera
              required:
              - uuid
              - name
  "/api/v1/devices/{uuid}":
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show a device with its sensors
      tags:
      - Devices
      responses:
        '200':
          description: device
          content:
            application/json:
              example:
                uuid: 123-123-000-000
                name: MKR1010 BME280
                description: Living room
                created_at: '2026-09-30T18:00:57.960Z'
                sensors:
                - uuid: 123-123-000-001
                  name: Temperature Sensor
                  description:
                  device_uuid: 123-123-000-000
                  sensor_type:
                    id: 574
                    name: Temperature
                    unit: C
                    pow10multi: -2
              schema:
                "$ref": "#/components/schemas/device"
        '404':
          description: unknown device
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Device not found
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/sensors/{sensor_uuid}/pictures":
    parameters:
    - name: sensor_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List the pictures of a sensor, newest first
      tags:
      - Pictures
      description: API key with scope read or admin. Paginated like the readings.
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: a page of pictures
          content:
            application/json:
              example:
                sensor:
                  uuid: 123-123-000-005
                  name: Camera
                  description:
                  device_uuid: 123-123-000-001
                  sensor_type:
                    id: 576
                    name: Camera
                    unit: jpg
                    pow10multi: 0
                pictures:
                - id: 49
                  date_time: '2026-09-30T12:00:00.000Z'
                  sensor_uuid: 123-123-000-005
                  size: 28
                  url: "/api/v1/pictures/49/file"
                next_cursor:
              schema:
                type: object
                properties:
                  sensor:
                    "$ref": "#/components/schemas/sensor"
                  pictures:
                    type: array
                    items:
                      "$ref": "#/components/schemas/picture"
                  next_cursor:
                    "$ref": "#/components/schemas/next_cursor"
                required:
                - sensor
                - pictures
                - next_cursor
                additionalProperties: false
    post:
      summary: Upload a picture
      tags:
      - Pictures
      description: Device token, for a sensor of that device only. JPEG or PNG, up
        to 5 MB. The file is stored under a server generated name.
      security:
      - deviceToken: []
      parameters: []
      responses:
        '201':
          description: picture stored
          content:
            application/json:
              example:
                id: 50
                date_time: '2026-09-30T12:00:00.000Z'
                sensor_uuid: 123-123-000-005
                size: 28
                url: "/api/v1/pictures/50/file"
              schema:
                "$ref": "#/components/schemas/picture"
        '422':
          description: not a JPEG/PNG image, or too large
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  message: Validation failed
                  details:
                    image:
                    - file is not a JPEG or PNG image
                    - can't be blank
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG, up to 5 MB
                date_time:
                  type: string
                  format: date-time
                  description: Capture time, defaults to the server time
              required:
              - file
        required: true
  "/api/v1/pictures/{id}/file":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Download a picture
      tags:
      - Pictures
      description: API key with scope read or admin.
      responses:
        '200':
          description: the image file
        '404':
          description: unknown picture
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Picture not found
              schema:
                "$ref": "#/components/schemas/error"
            image/jpeg:
              schema:
                "$ref": "#/components/schemas/error"
            image/png:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/sensors/{sensor_uuid}/readings":
    parameters:
    - name: sensor_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List the readings of a sensor, newest first
      tags:
      - Readings
      description: 'API key with scope read or admin. Paginated: pass next_cursor
        as cursor for the next page.'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Only readings with date_time >= from
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Only readings with date_time < to
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: a page of readings
          content:
            application/json:
              example:
                sensor:
                  uuid: 123-123-000-001
                  name: Temperature Sensor
                  description:
                  device_uuid: 123-123-000-000
                  sensor_type:
                    id: 581
                    name: Temperature
                    unit: C
                    pow10multi: -2
                readings:
                - id: 142
                  value: 2102
                  date_time: '2026-09-30T12:02:00.000Z'
                - id: 141
                  value: 2101
                  date_time: '2026-09-30T12:01:00.000Z'
                next_cursor: MjAyNi0wOS0zMFQxMjowMTowMC4wMDAwMDBafDE0MQ
              schema:
                type: object
                properties:
                  sensor:
                    "$ref": "#/components/schemas/sensor"
                  readings:
                    type: array
                    items:
                      "$ref": "#/components/schemas/reading"
                  next_cursor:
                    "$ref": "#/components/schemas/next_cursor"
                required:
                - sensor
                - readings
                - next_cursor
                additionalProperties: false
        '400':
          description: invalid query parameter
          content:
            application/json:
              example:
                error:
                  code: bad_request
                  message: cursor is invalid
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: unknown sensor
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Sensor not found
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a reading
      tags:
      - Readings
      description: Device token, for a sensor of that device only. Prefer POST /api/v1/readings
        to send several readings at once.
      security:
      - deviceToken: []
      parameters: []
      responses:
        '201':
          description: reading created
          content:
            application/json:
              example:
                id: 149
                value: 2150
                date_time: '2026-09-30T12:00:00.000Z'
                sensor_uuid: 123-123-000-001
              schema:
                "$ref": "#/components/schemas/reading"
        '404':
          description: unknown sensor, or a sensor of another device
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Sensor not found
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: invalid reading
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  message: Validation failed
                  details:
                    date_time:
                    - must be after 2000, the device clock is probably not set
                    value:
                    - must be an integer
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: integer
                  example: 2150
                  description: Raw integer value, see sensor_type.pow10multi
                date_time:
                  type: string
                  format: date-time
                  description: Measurement time, defaults to the server time
              required:
              - value
  "/api/v1/readings":
    post:
      summary: Add readings for several sensors at once
      tags:
      - Readings
      description: 'Device token. One request per measurement cycle (up to 100 readings),
        for sensors of that device. All or nothing: if one reading is invalid, none
        is stored.'
      security:
      - deviceToken: []
      parameters: []
      responses:
        '201':
          description: readings created
          content:
            application/json:
              example:
                readings:
                - id: 150
                  value: 2150
                  date_time: '2026-09-30T12:00:00.000Z'
                  sensor_uuid: 123-123-000-001
                - id: 151
                  value: 4520
                  date_time: '2026-09-30T12:00:00.000Z'
                  sensor_uuid: 123-123-000-003
              schema:
                type: object
                properties:
                  readings:
                    type: array
                    items:
                      "$ref": "#/components/schemas/reading"
                required:
                - readings
                additionalProperties: false
        '422':
          description: at least one invalid reading, nothing stored
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  message: Validation failed
                  details:
                    readings[1].value:
                    - is not a number
              schema:
                "$ref": "#/components/schemas/error"
        '400':
          description: missing or empty readings list
          content:
            application/json:
              example:
                error:
                  code: bad_request
                  message: 'param is missing or the value is empty or invalid: readings'
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                readings:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      sensor_uuid:
                        type: string
                      value:
                        type: integer
                        example: 2150
                        description: Raw integer value, see sensor_type.pow10multi
                      date_time:
                        type: string
                        format: date-time
                        description: Measurement time, defaults to the server time
                    required:
                    - sensor_uuid
                    - value
              required:
              - readings
  "/api/v1/devices/{device_uuid}/sensors":
    parameters:
    - name: device_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List the sensors of a device
      tags:
      - Sensors
      responses:
        '200':
          description: sensors
          content:
            application/json:
              example:
                sensors:
                - uuid: 123-123-000-001
                  name: Temperature Sensor
                  description:
                  device_uuid: 123-123-000-000
                  sensor_type:
                    id: 590
                    name: Temperature
                    unit: C
                    pow10multi: -2
              schema:
                type: object
                properties:
                  sensors:
                    type: array
                    items:
                      "$ref": "#/components/schemas/sensor"
                required:
                - sensors
                additionalProperties: false
        '404':
          description: unknown device
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Device not found
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Add a sensor to a device
      tags:
      - Sensors
      description: API key with scope admin.
      parameters: []
      responses:
        '201':
          description: sensor created
          content:
            application/json:
              example:
                uuid: 123-123-000-002
                name: Pressure Sensor
                description:
                device_uuid: 123-123-000-000
                sensor_type:
                  id: 592
                  name: Temperature
                  unit: C
                  pow10multi: -2
              schema:
                "$ref": "#/components/schemas/sensor"
        '422':
          description: invalid sensor (e.g. unknown sensor type)
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  message: Validation failed
                  details:
                    sensor_type:
                    - must exist
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid:
                  type: string
                  example: 123-123-000-002
                name:
                  type: string
                  example: Pressure Sensor
                description:
                  type: string
                sensor_type_id:
                  type: integer
                  description: See GET /api/v1/sensor_types
              required:
              - uuid
              - name
              - sensor_type_id
  "/api/v1/sensors/{uuid}":
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show a sensor
      tags:
      - Sensors
      responses:
        '200':
          description: sensor
          content:
            application/json:
              example:
                uuid: 123-123-000-001
                name: Temperature Sensor
                description:
                device_uuid: 123-123-000-000
                sensor_type:
                  id: 594
                  name: Temperature
                  unit: C
                  pow10multi: -2
              schema:
                "$ref": "#/components/schemas/sensor"
  "/api/v1/sensor_types":
    get:
      summary: List sensor types
      tags:
      - Sensor types
      responses:
        '200':
          description: sensor types
          content:
            application/json:
              example:
                sensor_types:
                - id: 595
                  name: Temperature
                  unit: C
                  pow10multi: -2
              schema:
                type: object
                properties:
                  sensor_types:
                    type: array
                    items:
                      "$ref": "#/components/schemas/sensor_type"
                required:
                - sensor_types
                additionalProperties: false
  "/api/v1/time":
    get:
      summary: Current server time
      tags:
      - Time
      description: Public (no token). Lets a device set its clock before posting readings.
      security: []
      responses:
        '200':
          description: current time
          content:
            application/json:
              example:
                current_date_time: '2026-09-30T18:00:59.314Z'
                epoch: 1790791259
              schema:
                type: object
                properties:
                  current_date_time:
                    type: string
                    format: date-time
                  epoch:
                    type: integer
                    description: Unix time in seconds
                required:
                - current_date_time
                - epoch
                additionalProperties: false
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Device token (esd_...). Lets a device post readings and pictures
        for its own sensors only.
    apiKey:
      type: http
      scheme: bearer
      description: 'API key (esk_...). Scope read: GET endpoints. Scope admin: also
        creates devices and sensors.'
  schemas:
    error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: Validation failed
            details:
              type: object
              description: Field name => list of messages (validation errors only)
              additionalProperties:
                type: array
                items:
                  type: string
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    sensor_type:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Temperature
        unit:
          type: string
          example: C
        pow10multi:
          type: integer
          description: Real value = value * 10^pow10multi
          example: -2
      required:
      - id
      - name
      - unit
      - pow10multi
      additionalProperties: false
    sensor:
      type: object
      properties:
        uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
        name:
          type: string
          example: Temperature Sensor
        description:
          type: string
          nullable: true
        device_uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
        sensor_type:
          "$ref": "#/components/schemas/sensor_type"
      required:
      - uuid
      - name
      - description
      - device_uuid
      - sensor_type
      additionalProperties: false
    device:
      type: object
      properties:
        uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
        name:
          type: string
          example: MKR1010 BME280
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00.000Z'
        sensors:
          type: array
          items:
            "$ref": "#/components/schemas/sensor"
      required:
      - uuid
      - name
      - description
      - created_at
      - sensors
      additionalProperties: false
    device_with_token:
      type: object
      description: A device just created, with its device token (shown only once)
      properties:
        uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
        name:
          type: string
          example: MKR1010 BME280
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00.000Z'
        sensors:
          type: array
          items:
            "$ref": "#/components/schemas/sensor"
        api_token:
          type: string
          example: esd_...
      required:
      - uuid
      - name
      - description
      - created_at
      - sensors
      - api_token
      additionalProperties: false
    reading:
      type: object
      properties:
        id:
          type: integer
        value:
          type: integer
          description: Raw integer value, see sensor_type.pow10multi
          example: 2150
        date_time:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00.000Z'
        sensor_uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
      required:
      - id
      - value
      - date_time
      additionalProperties: false
    picture:
      type: object
      properties:
        id:
          type: integer
        date_time:
          type: string
          format: date-time
          example: '2026-09-30T12:00:00.000Z'
        sensor_uuid:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_:-]{0,63}$"
          example: 123-123-000-001
        size:
          type: integer
          description: File size in bytes
        url:
          type: string
          example: "/api/v1/pictures/1/file"
      required:
      - id
      - date_time
      - sensor_uuid
      - size
      - url
      additionalProperties: false
    next_cursor:
      type: string
      nullable: true
      description: Pass as cursor to get the next page; null on the last page
