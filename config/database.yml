default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: envsensing_development
  username: envsensing
  password: envsensing
  host: localhost
  port: 5432

test:
  <<: *default
  database: envsensing_test
  username: envsensing
  password: envsensing
  host: localhost
  port: 5432

production:
  <<: *default
  database: envsensing_production
  username: postgres
  password: postgres
  host: db
