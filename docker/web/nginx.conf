# Rendered at container start by the nginx image (envsubst on ${HTTPS_PORT} only; nginx's own
# $variables are left alone because they are not environment variables).

upstream app {
  server app:3000;
}

# Per client IP, before requests reach Rails (rack-attack then limits per token).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server_tokens off;

# Plain HTTP only redirects to HTTPS.
server {
  listen 80;
  listen [::]:80;
  return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  # bin/generate-lan-cert, mounted read-only from docker/web/certs
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # Mozilla "intermediate": TLS 1.2 for microcontrollers, TLS 1.3 for everything else.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /var/www/public;

  # Pictures are limited to 5 MB by the uploader; leave room for multipart overhead.
  client_max_body_size 6m;
  # Drop slow clients instead of holding connections open (slowloris).
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  limit_req zone=per_ip burst=40 nodelay;
  limit_conn conn_per_ip 20;
  limit_req_status 429;
  limit_conn_status 429;

  # Deny requests for files that should never be accessed.
  location ~ /\. {
    deny all;
  }
  location ~* \.(rb|log)$ {
    deny all;
  }

  # Static files from public/ when present, otherwise Rails.
  location / {
    try_files $uri @app;
  }

  # JSON API: nothing in a response may be executed or framed by a browser.
  location /api/ {
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    proxy_pass http://app;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }

  location @app {
    proxy_pass http://app;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }

  # Picture files: Rails checks the token and replies with X-Accel-Redirect, nginx sends the file.
  # internal: not reachable by clients directly.
  location /rails/storage/ {
    internal;
    alias /rails/storage/;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'" always;
  }
}
