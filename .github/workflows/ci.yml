name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envsensing
          POSTGRES_PASSWORD: envsensing
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://envsensing:envsensing@localhost:5432/envsensing_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare the database
        run: bin/rails db:create db:schema:load

      - name: Check autoloading
        run: bin/rails zeitwerk:check

      # Includes the rswag specs in spec/integration, which validate every documented
      # response against swagger/v1/swagger.yaml's schemas.
      - name: Run specs
        run: bundle exec rspec

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Catches Dockerfile breakage (base image, packages, asset precompilation) before a deploy does.
      - name: Build the app image
        run: docker build -f docker/app/Dockerfile -t envsensing-app .

      - name: Build the web image
        run: docker build -f docker/web/Dockerfile -t envsensing-web .
